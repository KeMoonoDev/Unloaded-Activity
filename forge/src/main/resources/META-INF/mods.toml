modLoader = "javafml"
loaderVersion = "[43,)"
issueTrackerURL = "https://github.com/KeMoonoDev/Unloaded-Activity/issues"
license = "GNU LGPLv3"

[[mods]]
modId = "unloadedactivity"
version = "${version}"
displayName = "Unloaded Activity"
authors = "Moono"
description = "Simulates blocks/entities, like crops, furnaces or baby mobs, to make them catch up after having been unloaded for a while."
logoFile = "icon256.png"

[[dependencies.unloadedactivity]]
modId = "forge"
mandatory = true
versionRange = "[43,)"
ordering = "NONE"
side = "SERVER"

[[dependencies.unloadedactivity]]
modId = "minecraft"
mandatory = true
versionRange = "${compatible_versions_neo_or_forge}"
ordering = "NONE"
side = "SERVER"

["lithium:options"]
"world.block_entity_ticking.sleeping.furnace" = false

["unloadedactivity:options"]
disable_compat = ["examplemod"]