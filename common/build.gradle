
unimined.minecraft {
    fabric {
        loader fabric_loader_version
        accessWidener = file("src/main/resources/unloadedactivity${rootProject.aw_namespace}.classtweaker")
    }

    defaultRemapJar = false
    runs.off = true
}

def mc_info = new Properties()

rootDir.listFiles().each { file ->
    if (file.name == "build.properties") {
        mc_info.load(file.newReader())
    }
}
processResources {
    if (rootProject.using_legacy_folders) {
        filesMatching("**/tags/block/**") {
            path = path.replaceFirst("block", "blocks")
        }
    }

    if (!rootProject.cactus_flowers_are_added) {
        filesMatching("data/minecraft/simulate_info/blocks/cactus.json") {
            filter { line ->
                line.replace('"stop_updating_after_max_height": false', '"stop_updating_after_max_height": true')
                        .replace('age_bloom', '_age_bloom')
            }
        }
    }

    if (!rootProject.lightning_rod_is_oxidizable) {
        exclude("data/minecraft/simulate_info/blocks/lightning_rod.json")
        filesMatching("**/oxidized_level/0.json") {
            filter { line ->
                line.replace("minecraft:lightning_rod", "unloadedactivity:empty")
            }
        }
    }

    // Farmer's Delight
    if (mc_info.MC_VER <= mc_info.MC_1_19_4) {
        exclude("data/farmersdelight/simulate_info/blocks/compat/farmersdelight/tomatoes.json")
        exclude("data/farmersdelight/simulate_info/blocks/compat/farmersdelight/tomatoes_on_rope.json")

        filesMatching("data/farmersdelight/simulate_info/blocks/compat/farmersdelight/1_19_tomatoes.json") {
            path = path.replaceFirst("1_19_tomatoes", "tomatoes")
        }
    } else {
        exclude("data/farmersdelight/simulate_info/blocks/compat/farmersdelight/1_19_tomatoes.json")
    }
}

dependencies {
    // Since these are only for compiling,
    // I can mix and match both (neo)forge and fabric versions and game versions.

    // To not have to deal with conditionally supporting mods depending on the Minecraft version,
    // and also hopefully add some future proofing, Minecraft versions without any mod support
    // for it will get the closest mod version for that Minecraft version.

    // Farmer's Delight
    if (mc_info.MC_VER >= mc_info.MC_1_21_1) {
        compileOnly "maven.modrinth:farmers-delight:1.21.1-1.3.2"

    } else if (mc_info.MC_VER >= mc_info.MC_1_20_1) {
        compileOnly "maven.modrinth:farmers-delight:1.20.1-1.3.2"

    } else if (mc_info.MC_VER >= mc_info.MC_1_19_2) {
        compileOnly "maven.modrinth:farmers-delight:1.19.2-1.2.4"
    }

    // Supplementaries
    if (mc_info.MC_VER >= mc_info.MC_1_21_1) {
        compileOnly ("net.mehvahdjukaar:supplementaries-common:1.21.1-3.8.10") {
            transitive = false
        }
        compileOnly ("net.mehvahdjukaar:moonlight-common:1.21.1-3.3.4") {
            transitive = false
        }

    } else if (mc_info.MC_VER >= mc_info.MC_1_20_1) {
        compileOnly "maven.modrinth:fFEIiSDQ:S0TIJ1hU" // Supplementaries Forge 1.20-3.1.43-forge
        compileOnly "maven.modrinth:twkfQtEc:43kjMXMx" // Moonlight Lib Forge 1.20-2.16.34-forge

    } else if (mc_info.MC_VER >= mc_info.MC_1_19_4) {
        compileOnly "maven.modrinth:fFEIiSDQ:YkUV4QJ2" // Supplementaries Forge 1.19.4-2.4.15
        compileOnly "maven.modrinth:twkfQtEc:G82otMKn" // Moonlight Lib Forge 1.19.4-2.4.15

    } else if (mc_info.MC_VER >= mc_info.MC_1_19_2) {
        compileOnly "maven.modrinth:fFEIiSDQ:UQu29fD5" // Supplementaries Forge 1.19.2-2.4.20
        compileOnly "maven.modrinth:twkfQtEc:4R7I44b3" // Moonlight Lib Forge 1.19.2-2.3.7
    }

    // No Man's Land
    // This mod only supports 1.21.1.
    if (mc_info.MC_VER == mc_info.MC_1_21_1) {
        compileOnly "maven.modrinth:kjZCvAn6:bcszfrVc" // 1.5.12
    }
}